services:
  traefik:
    image: traefik:3.6
    restart: always
    ports:
      - "80:80"
      - "443:443"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.https.address=:443
      - --certificatesresolvers.le.acme.email=${EMAIL}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --accesslog
      - --log
      - --api=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/certificates
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-dashboard-http.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik-dashboard-http.entrypoints=http
      - traefik.http.routers.traefik-dashboard-http.middlewares=https-redirect
      - traefik.http.routers.traefik-dashboard-https.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.routers.traefik-dashboard-https.entrypoints=https
      - traefik.http.routers.traefik-dashboard-https.tls=true
      - traefik.http.routers.traefik-dashboard-https.tls.certresolver=le
      - traefik.http.routers.traefik-dashboard-https.service=api@internal
      - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true

  pgadmin:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.foundry-pgadmin.loadbalancer.server.port=80
      - traefik.http.routers.foundry-pgadmin-http.rule=Host(`pgadmin.${DOMAIN}`)
      - traefik.http.routers.foundry-pgadmin-http.entrypoints=http
      - traefik.http.routers.foundry-pgadmin-http.middlewares=https-redirect
      - traefik.http.routers.foundry-pgadmin-https.rule=Host(`pgadmin.${DOMAIN}`)
      - traefik.http.routers.foundry-pgadmin-https.entrypoints=https
      - traefik.http.routers.foundry-pgadmin-https.tls=true
      - traefik.http.routers.foundry-pgadmin-https.tls.certresolver=le
    networks:
      - default
      - traefik-public

  api:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.foundry-api.loadbalancer.server.port=8000
      - traefik.http.routers.foundry-api-http.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.foundry-api-http.entrypoints=http
      - traefik.http.routers.foundry-api-http.middlewares=https-redirect
      - traefik.http.routers.foundry-api-https.rule=Host(`api.${DOMAIN}`)
      - traefik.http.routers.foundry-api-https.entrypoints=https
      - traefik.http.routers.foundry-api-https.tls=true
      - traefik.http.routers.foundry-api-https.tls.certresolver=le
    networks:
      - default
      - traefik-public

  web:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.foundry-web.loadbalancer.server.port=5173
      - traefik.http.routers.foundry-web-http.rule=Host(`dashboard.${DOMAIN}`)
      - traefik.http.routers.foundry-web-http.entrypoints=http
      - traefik.http.routers.foundry-web-http.middlewares=https-redirect
      - traefik.http.routers.foundry-web-https.rule=Host(`dashboard.${DOMAIN}`)
      - traefik.http.routers.foundry-web-https.entrypoints=https
      - traefik.http.routers.foundry-web-https.tls=true
      - traefik.http.routers.foundry-web-https.tls.certresolver=le
    networks:
      - default
      - traefik-public

  docs:
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.services.foundry-docs.loadbalancer.server.port=5174
      - traefik.http.routers.foundry-docs-http.rule=Host(`docs.${DOMAIN}`)
      - traefik.http.routers.foundry-docs-http.entrypoints=http
      - traefik.http.routers.foundry-docs-http.middlewares=https-redirect
      - traefik.http.routers.foundry-docs-https.rule=Host(`docs.${DOMAIN}`)
      - traefik.http.routers.foundry-docs-https.entrypoints=https
      - traefik.http.routers.foundry-docs-https.tls=true
      - traefik.http.routers.foundry-docs-https.tls.certresolver=le
    networks:
      - default
      - traefik-public

volumes:
  traefik-certs:

networks:
  traefik-public:
    external: true
