services:
  fastapi:
    build:
      context: .
      dockerfile: api/api.Dockerfile
    restart: unless-stopped
    working_dir: /workspace/api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:5432/${POSTGRES_DB:-vortex}
      - REDIS_URL=redis://redis:6379/0
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/health', headers={'X-API-Version':'v1'}); urllib.request.urlopen(req, timeout=5)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "8000:8000"

  fastapi-worker:
    build:
      context: .
      dockerfile: api/api.Dockerfile
    restart: unless-stopped
    working_dir: /workspace/api
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@pgbouncer:5432/${POSTGRES_DB:-vortex}
      - REDIS_URL=redis://redis:6379/0
    command: python -m app.worker
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      redis:
        condition: service_started
