services:
  postgres:
    image: postgres:18
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-foundry}"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 10s
    volumes:
      - foundry-db-data:/var/lib/postgresql
    env_file:
      - .env.compose
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-foundry}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}

  pgadmin:
    image: dpage/pgadmin4:9
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.compose
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-changethis}
      - PGADMIN_LISTEN_PORT=80
      - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json
    volumes:
      - foundry-pgadmin-data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: always
    working_dir: /workspace/apps/api
    env_file:
      - .env
      - .env.compose
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-foundry}
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; req=urllib.request.Request('http://127.0.0.1:8000/health', headers={'X-API-Version':'v1'}); urllib.request.urlopen(req, timeout=5)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: always
    working_dir: /workspace
    command: pnpm --filter @foundry/web dev --host 0.0.0.0 --port 5173
    depends_on:
      api:
        condition: service_healthy

  docs:
    build:
      context: .
      dockerfile: infra/docker/docs.Dockerfile
    restart: always
    working_dir: /workspace
    command: pnpm --filter @foundry/docs dev --host 0.0.0.0

volumes:
  foundry-db-data:
  foundry-pgadmin-data:
