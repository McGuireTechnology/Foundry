services:
  pgadmin:
    image: vortex-pgadmin
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PGADMIN_VERSION: ${PGADMIN_VERSION:-9}
    restart: always
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-changethis}
      - PGADMIN_LISTEN_PORT=80
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  pgadmin-data:
