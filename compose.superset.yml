services:
  superset-init:
    image: apache/superset:4.1.1
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-thisISaSECRET_ChangeMe}
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py
      - DATABASE_DIALECT=postgresql
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
    volumes:
      - superset-home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >
      /bin/sh -c "
      superset db upgrade &&
      superset fab create-admin
      --username ${SUPERSET_ADMIN_USERNAME:-admin}
      --firstname Vortex
      --lastname Admin
      --email ${SUPERSET_ADMIN_EMAIL:-admin@example.com}
      --password ${SUPERSET_ADMIN_PASSWORD:-admin}
      || true &&
      superset init
      "

  superset:
    image: apache/superset:4.1.1
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-thisISaSECRET_ChangeMe}
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py
      - DATABASE_DIALECT=postgresql
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
    volumes:
      - superset-home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    ports:
      - "8088:8088"
    command: /bin/sh -c "superset run -h 0.0.0.0 -p 8088"

  superset-worker:
    image: apache/superset:4.1.1
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-thisISaSECRET_ChangeMe}
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py
      - DATABASE_DIALECT=postgresql
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
    volumes:
      - superset-home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: /bin/sh -c "celery --app=superset.tasks.celery_app:app worker -Ofair -l INFO"

  superset-beat:
    image: apache/superset:4.1.1
    restart: unless-stopped
    depends_on:
      superset-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY:-thisISaSECRET_ChangeMe}
      - SUPERSET_CONFIG_PATH=/app/pythonpath/superset_config.py
      - DATABASE_DIALECT=postgresql
      - DATABASE_USER=${POSTGRES_USER:-postgres}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
    volumes:
      - superset-home:/app/superset_home
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: /bin/sh -c "celery --app=superset.tasks.celery_app:app beat -l INFO"

volumes:
  superset-home:
