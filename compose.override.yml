services:
  proxy:
    image: traefik:3.6
    restart: "no"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "80:80"
      - "8090:8080"

  postgres:
    restart: "no"
    ports:
      - "5432:5432"

  pgadmin:
    restart: "no"
    ports:
      - "5050:80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.foundry-pgadmin.rule=Host(`pgadmin.localhost`)
      - traefik.http.routers.foundry-pgadmin.entrypoints=http
      - traefik.http.services.foundry-pgadmin.loadbalancer.server.port=80

  api:
    restart: "no"
    ports:
      - "8000:8000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.foundry-api.rule=Host(`api.localhost`)
      - traefik.http.routers.foundry-api.entrypoints=http
      - traefik.http.services.foundry-api.loadbalancer.server.port=8000
    develop:
      watch:
        - action: sync
          path: ./apps/api/app
          target: /workspace/apps/api/app
        - action: sync
          path: ./apps/api/tests
          target: /workspace/apps/api/tests
        - action: rebuild
          path: ./apps/api/pyproject.toml
        - action: rebuild
          path: ./apps/api/package.json

  web:
    restart: "no"
    ports:
      - "5173:5173"
    labels:
      - traefik.enable=true
      - traefik.http.routers.foundry-web.rule=Host(`app.localhost`) || Host(`localhost`)
      - traefik.http.routers.foundry-web.entrypoints=http
      - traefik.http.services.foundry-web.loadbalancer.server.port=5173
    develop:
      watch:
        - action: sync+restart
          path: ./apps/web
          target: /workspace/apps/web
        - action: sync+restart
          path: ./packages
          target: /workspace/packages
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./apps/web/package.json

  docs:
    restart: "no"
    ports:
      - "5174:5174"
    labels:
      - traefik.enable=true
      - traefik.http.routers.foundry-docs.rule=Host(`docs.localhost`)
      - traefik.http.routers.foundry-docs.entrypoints=http
      - traefik.http.services.foundry-docs.loadbalancer.server.port=5174
      - traefik.http.routers.foundry-docs.priority=20
    develop:
      watch:
        - action: sync+restart
          path: ./apps/docs
          target: /workspace/apps/docs
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./apps/docs/package.json
