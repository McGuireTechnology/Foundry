name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install web deps
        run: npm ci --prefix web
      - name: Install docs deps
        run: npm ci --prefix docs
      - name: Typecheck web
        run: npm run typecheck --prefix web

  apple-client-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Vortex for macOS
        run: >
          xcodebuild
          -project apple/Vortex/Vortex.xcodeproj
          -scheme Vortex
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build Vortex for iOS Simulator
        run: >
          xcodebuild
          -project apple/Vortex/Vortex.xcodeproj
          -scheme Vortex
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
