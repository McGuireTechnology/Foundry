name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Install JS deps
        run: pnpm install --frozen-lockfile=false
      - name: Typecheck
        run: pnpm typecheck

  apple-client-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build Foundry for macOS
        run: >
          xcodebuild
          -project apps/apple/Foundry/Foundry.xcodeproj
          -scheme Foundry
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build Foundry for iOS Simulator
        run: >
          xcodebuild
          -project apps/apple/Foundry/Foundry.xcodeproj
          -scheme Foundry
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
