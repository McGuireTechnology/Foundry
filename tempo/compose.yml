services:
  tempo:
    profiles: ["tempo"]
    image: grafana/tempo:2.7.1
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
      - "4319:4317"

volumes:
  tempo-data:
